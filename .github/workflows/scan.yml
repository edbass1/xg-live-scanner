name: Scansione live
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: live, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cp saved.json /tmp/saved_old.json || true
      - run: python scan.py
      - run: python notify_telegram.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "xg-bot"; git config user.email "xg-bot@users.noreply.github.com"
          git add data.json saved.json
          git diff --cached --quiet || (git commit -q -m "live $(date -u +%FT%TZ)" && git pull --rebase -q && git push)
